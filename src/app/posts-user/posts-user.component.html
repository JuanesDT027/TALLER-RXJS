<h4 class="mt-4"><i class="bi bi-chat-left-text"></i> Publicaciones</h4>

<!-- Loader -->
<div *ngIf="loading" class="alert alert-info">Cargando publicaciones...</div>

<!-- Error -->
<div *ngIf="error" class="alert alert-danger">
  {{ error }}
</div>

<!-- Lista de publicaciones -->
<div *ngIf="!loading && !error && posts.length > 0">
  <div *ngFor="let post of posts" class="card my-3 shadow-sm">
    <div class="card-body">
      <h5 class="card-title">{{ post.title }}</h5>
      <p class="card-text">{{ post.body }}</p>

      <!-- ✅ Reacciones -->
      <p class="text-muted">
        <i class="bi bi-hand-thumbs-up"></i> {{ post.reactions }} reacciones
      </p>

      <!-- ✅ Comentarios -->
      <div *ngIf="comments[post.id] && comments[post.id].length > 0">
        <h6><i class="bi bi-chat-dots"></i> Comentarios:</h6>
        <ul class="list-group">
          <li *ngFor="let comment of comments[post.id]" class="list-group-item">
            <strong>{{ comment.user.username }}:</strong> {{ comment.body }}
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>

<!-- Sin publicaciones -->
<div
  *ngIf="!loading && !error && posts.length === 0"
  class="alert alert-warning"
>
  Este usuario no tiene publicaciones.
</div>
