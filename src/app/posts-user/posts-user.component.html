<div *ngIf="posts.length > 0">
  <h4 class="mt-4"><i class="bi bi-chat-left-text"></i> Publicaciones</h4>

  <div *ngFor="let post of posts" class="card my-3 shadow-sm">
    <div class="card-body">
      <h5 class="card-title">{{ post.title }}</h5>
      <p class="card-text">{{ post.body }}</p>
    </div>
  </div>
</div>
